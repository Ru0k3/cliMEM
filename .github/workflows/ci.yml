name: cliMEM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q app test

      - name: Run mock-provider schema unit tests
        run: python -m unittest -v test.test_mock_provider_schema

      - name: Run fallback integration test
        run: python test/fallback_test.py

      - name: Run end-to-end integration test
        run: python test/e2e.py
